services:
  api:
    build: .
    container_name: wrenchiq_api
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: wrenchiq
      DB_PASSWORD: wrenchiq
      DB_NAME: wrenchiq
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
      ADMIN_SECRET_KEY: wrenchiq-dev-secret
      DATABASE_URL_TEST: postgresql+asyncpg://wrenchiq:wrenchiq@postgres:5432/wrenchiq_test
      JWT_SECRET_KEY: wrenchiq-dev-jwt-secret
      # 30 dias — bem mais que o padrão (60 min), só pra não deslogar no
      # meio dos testes. Valor de dev; produção deve voltar pra algo curto.
      JWT_EXPIRA_MINUTOS: "43200"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wrenchiq_net

  frontend:
    build: ./frontend
    container_name: wrenchiq_frontend
    restart: unless-stopped
    ports:
      - "3011:3000"
    networks:
      - wrenchiq_net

  postgres:
    image: pgvector/pgvector:pg15
    container_name: wrenchiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wrenchiq
      POSTGRES_PASSWORD: wrenchiq
      POSTGRES_DB: wrenchiq
    ports:
      - "5433:5432"
    volumes:
      - wrenchiq_postgres_data:/var/lib/postgresql/data
    networks:
      - wrenchiq_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrenchiq -d wrenchiq"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  wrenchiq_net:
    name: wrenchiq_net

volumes:
  wrenchiq_postgres_data:
